; php-fpm for VentaCart. Runs as whatever user Wings starts the container as,
; so there is no user or group to switch to.

[global]
pid = /tmp/ventacart/php-fpm.pid
; A file, not /proc/self/fd/2: an unprivileged user cannot always reopen the
; container's output by path. Laravel's own log is storage/logs/laravel.log.
error_log = /home/container/storage/logs/php-fpm.log
log_level = warning
daemonize = no

[www]
listen = /tmp/ventacart/php-fpm.sock

pm = dynamic
pm.max_children = ${FPM_WORKERS}
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

; The egg's settings reach Laravel as environment variables, so PHP must see
; the environment the container was started with.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
