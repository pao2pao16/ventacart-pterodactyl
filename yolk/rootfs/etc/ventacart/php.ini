; Loaded by both the CLI and php-fpm.

memory_limit = 512M
max_execution_time = 300
max_input_time = 120
; The product form posts every variant row at once.
max_input_vars = 5000
upload_max_filesize = 64M
post_max_size = 70M
; On the server's disk rather than the small /tmp Wings gives the container.
upload_tmp_dir = /home/container/.runtime/tmp
expose_php = Off
date.timezone = UTC
session.use_strict_mode = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The code can be updated in place, so changed files must still be noticed.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
